<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Gold anchor ring -->
  <circle cx="32" cy="18" r="6" stroke="#fbbf24" stroke-width="3.5" fill="none"/>
  <!-- Anchor shaft -->
  <line x1="32" y1="24" x2="32" y2="48" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="22" y1="28" x2="42" y2="28" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Lower curved arms -->
  <path d="M14 38 C 16 52, 48 52, 50 38" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Left flukes -->
  <line x1="14" y1="38" x2="11" y2="34" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Right flukes -->
  <line x1="50" y1="38" x2="53" y2="34" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
